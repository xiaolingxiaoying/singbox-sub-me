# NovixLink: resolve through the selected proxy before GEOIP routing.
mode: rule
proxy-groups:
- name: 🌍选择代理节点
  type: select
  proxies:
  - ♻️自动选择
  - DIRECT
  - sbctl-vless-reality
  - sbctl-vmess-websocket
  - sbctl-hysteria2
  - sbctl-tuic
  - sbctl-anytls
- name: ♻️自动选择
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  proxies:
  - sbctl-vless-reality
  - sbctl-vmess-websocket
  - sbctl-hysteria2
  - sbctl-tuic
  - sbctl-anytls
rules:
- DOMAIN-SUFFIX,chatgpt.com,🌍选择代理节点
- DOMAIN-SUFFIX,openai.com,🌍选择代理节点
- DOMAIN-SUFFIX,oaistatic.com,🌍选择代理节点
- DOMAIN-SUFFIX,oaiusercontent.com,🌍选择代理节点
- GEOIP,LAN,DIRECT
- GEOIP,CN,DIRECT
- MATCH,🌍选择代理节点
dns!:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - +.lan
  - +.local
  use-hosts: false
  use-system-hosts: false
  respect-rules: false
  nameserver:
  - https://1.1.1.1/dns-query#🌍选择代理节点
  - https://8.8.8.8/dns-query#🌍选择代理节点
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  - https://doh.pub/dns-query
