[package]
name = "sbctl"
version = "0.1.26"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Control plane for a private sing-box deployment"

[workspace]
members = ["crates/sbtui", "crates/client-core", "crates/sbgui"]

[features]
# Explicitly opt in for fixture-only CLI/acceptance binaries. Never publish.
test-signing = []

[[test]]
name = "cli"
path = "tests/cli/main.rs"
required-features = ["test-signing"]

[dependencies]
base64 = "0.22.1"
bytes = "1.10.1"
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.5.48", features = ["derive"] }
ed25519-dalek = "2.1.1"
fs2 = "0.4.3"
getrandom = "0.3.3"
http-body-util = "0.1.3"
hyper = { version = "1.6.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.13", features = ["tokio"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rcgen = "0.14"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
thiserror = "2.0.16"
tempfile = "3.23.0"
toml = "0.8.20"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = "0.26.4"
rustls = "0.23.35"
rustls-pemfile = "2.2.0"
x25519-dalek = "2.0.1"
x509-parser = "0.18.1"

[target.'cfg(unix)'.dependencies]
# Restores the default SIGPIPE disposition so piped output (e.g.
# `sbctl status | head`) does not panic on a closed pipe.
libc = "0.2"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
rcgen = "0.14"
serde_yaml = "0.9.34"
url = "2.5.7"
