[package]
name = "sbctl"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Control plane for a private sing-box deployment"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.5.48", features = ["derive"] }
fs2 = "0.4.3"
getrandom = "0.3.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
toml = "0.8.20"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt"] }
tokio-rustls = "0.26.4"
rustls = "0.23.35"
rustls-pemfile = "2.2.0"
x25519-dalek = "2.0.1"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
serde_yaml = "0.9.34"
tempfile = "3.23.0"
