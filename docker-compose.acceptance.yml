services:
  sbctl-acceptance:
    build:
      context: .
      dockerfile: tests/acceptance/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-debian:12-slim}
    container_name: sbctl-acceptance
    privileged: true
    cgroup: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ${SBCTL_ARTIFACT:-./target/release/sbctl}:/opt/sbctl/sbctl:ro
    stop_signal: SIGRTMIN+3
    command: ["/sbin/init"]
