name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sing_box_version:
        description: Official sing-box version to bundle (blank resolves latest stable)
        required: false
        type: string
      tag:
        description: Existing or new release tag
        required: true
        type: string

permissions:
  # Only the publication step needs write access; every build and acceptance
  # job runs untrusted-ish input (downloaded archives, installer scripts) and
  # must not be able to rewrite releases or other tags on its own token.
  contents: read

# Two overlapping releases would race on the same tag and assets.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-sbctl:
    needs: checks
    env:
      SBCTL_RELEASE_PUBLIC_KEY_HEX: ${{ vars.SBCTL_RELEASE_PUBLIC_KEY_HEX }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install ARM64 cross compiler
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Validate the production trust anchor
        run: python3 scripts/prepare-installer.py install.sh
      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
        run: cargo build --release --locked -p sbctl --no-default-features --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/sbctl sbctl-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: sbctl-${{ matrix.arch }}
          path: sbctl-linux-${{ matrix.arch }}

  build-acceptance-client:
    needs: checks
    # Build the client only as a test fixture for server acceptance. It is
    # deliberately never downloaded by the release packaging job.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libfreetype6-dev libx11-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev \
            libegl1-mesa-dev libvulkan-dev libasound2-dev
      - run: cargo build --release --locked -p sbtui
      - run: cp target/release/sbtui sbtui-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-sbtui-linux-amd64
          path: sbtui-linux-amd64
          if-no-files-found: error

  acceptance:
    needs: [build-sbctl, build-acceptance-client]
    # The fixture verifier is copied into Debian 12 containers; build it on
    # Ubuntu 22.04 so it does not require a newer GLIBC than the test hosts.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sbctl-amd64
      - run: chmod 0755 sbctl-linux-amd64
      # `run.sh` requires all three artifacts and runs under `set -eu`, so the
      # client binary is not optional here: without it the acceptance leg aborts
      # before starting a container and the release publishes unverified bytes.
      - uses: actions/download-artifact@v4
        with:
          name: acceptance-sbtui-linux-amd64
      - run: chmod 0755 sbtui-linux-amd64
      - uses: dtolnay/rust-toolchain@stable
      - name: Build isolated fixture verifier (never uploaded)
        run: cargo build --release --locked -p sbctl --features test-signing --target-dir target-fixtures
      - name: Validate production lifecycle and fixture-signed rollback on systemd hosts
        run: SBCTL_ARTIFACT="$GITHUB_WORKSPACE/sbctl-linux-amd64" SBCTL_TEST_ARTIFACT="$GITHUB_WORKSPACE/target-fixtures/release/sbctl" SBCTUI_ARTIFACT="$GITHUB_WORKSPACE/sbtui-linux-amd64" sh tests/acceptance/run.sh

  package:
    needs: [build-sbctl, acceptance]
    # The only job allowed to create or publish a release.
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    environment: release
    env:
      SBCTL_RELEASE_PUBLIC_KEY_HEX: ${{ vars.SBCTL_RELEASE_PUBLIC_KEY_HEX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sbctl-*
          merge-multiple: true
      - name: Resolve sing-box release version
        id: sing-box-version
        env:
          REQUESTED_VERSION: ${{ inputs.sing_box_version }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_VERSION" ]; then
            version="${REQUESTED_VERSION#v}"
          else
            tag=$(gh api repos/SagerNet/sing-box/releases/latest --jq .tag_name)
            version="${tag#v}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "invalid sing-box version: $version" >&2; exit 2;
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Using official sing-box version $version"
      - name: Download and verify official sing-box archives
        env:
          SING_BOX_VERSION: ${{ steps.sing-box-version.outputs.version }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            archive="sing-box-${SING_BOX_VERSION}-linux-${arch}.tar.gz"
            url="https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/${archive}"
            curl --fail --location --silent --show-error "$url" --output "$archive"
            mkdir -p "extract-${arch}"
            tar -xzf "$archive" -C "extract-${arch}"
            install -m 0755 "extract-${arch}/sing-box-${SING_BOX_VERSION}-linux-${arch}/sing-box" "sing-box-linux-${arch}"
            rm -rf "extract-${arch}" "$archive"
          done
      - name: Install tooling for manifest signing
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          install -m 0755 sbctl-linux-amd64 /usr/local/bin/sbctl
      - name: Sign and verify every artifact before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          SING_BOX_VERSION: ${{ steps.sing-box-version.outputs.version }}
          SBCTL_SIGNING_SEED: ${{ secrets.SBCTL_SIGNING_SEED }}
        run: |
          set -euo pipefail
          # A manual dispatch checks out the selected branch, not the tag it is
          # told to publish. Refuse unless both name the same commit, or bytes
          # built from one commit get signed and shipped as another release.
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            git fetch --depth=1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
            head_commit=$(git rev-parse HEAD)
            if [ "$tag_commit" != "$head_commit" ]; then
              echo "refusing to publish: $RELEASE_TAG points at $tag_commit, tree is $head_commit" >&2
              exit 2
            fi
          fi
          test -n "$SBCTL_SIGNING_SEED" || { echo 'Missing production signing secret' >&2; exit 2; }
          umask 077
          export SBCTL_SIGNING_KEY="$RUNNER_TEMP/sbctl-release-key.hex"
          trap 'rm -f "$SBCTL_SIGNING_KEY"' EXIT
          printf '%s' "$SBCTL_SIGNING_SEED" > "$SBCTL_SIGNING_KEY"
          unset SBCTL_SIGNING_SEED
          python3 scripts/prepare-installer.py install.sh
          for arch in amd64 arm64; do
            scripts/generate-manifest.sh \
              "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$SING_BOX_VERSION" "$arch" \
              "sbctl-linux-$arch" "sing-box-linux-$arch" "manifest-$arch.json"
          done
      - name: Create GitHub release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --generate-notes
          # No --clobber on purpose: published bytes are immutable, so a re-run
          # over an existing asset fails loudly instead of swapping what every
          # already-installed host will download and trust.
          gh release upload "$RELEASE_TAG" \
            sbctl-linux-amd64 sbctl-linux-arm64 sing-box-linux-amd64 sing-box-linux-arm64 \
            manifest-amd64.json manifest-arm64.json install.sh \
            --repo "$GITHUB_REPOSITORY"
