name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sing_box_version:
        description: Official sing-box version to bundle, without the v prefix
        required: true
        type: string
      tag:
        description: Existing or new release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-sbctl:
    needs: checks
    env:
      SBCTL_RELEASE_PUBLIC_KEY_HEX: ${{ vars.SBCTL_RELEASE_PUBLIC_KEY_HEX }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install ARM64 cross compiler
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Validate the production trust anchor
        run: python3 scripts/prepare-installer.py install.sh
      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
        run: cargo build --release -p sbctl --no-default-features --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/sbctl sbctl-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: sbctl-${{ matrix.arch }}
          path: sbctl-linux-${{ matrix.arch }}

  build-sbtui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: sbtui-windows-amd64.exe
            shortcut: ly-windows-amd64.exe
          - os: macos-14
            artifact: sbtui-macos-arm64
            shortcut: ly-macos-arm64
          - os: ubuntu-22.04
            artifact: sbtui-linux-amd64
            shortcut: ly-linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p sbtui
      - name: Stage the desktop binary and the ly shortcut
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/sbtui.exe "${{ matrix.artifact }}"
            cp target/release/ly.exe "${{ matrix.shortcut }}"
          else
            cp target/release/sbtui "${{ matrix.artifact }}"
            cp target/release/ly "${{ matrix.shortcut }}"
            chmod +x "${{ matrix.artifact }}" "${{ matrix.shortcut }}"
          fi
          cp crates/sbtui/packaging/install.sh sbtui-install.sh
          chmod +x sbtui-install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sbtui-bin-${{ matrix.os }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.shortcut }}
            sbtui-install.sh

  acceptance:
    needs: build-sbctl
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sbctl-amd64
      - run: chmod 0755 sbctl-linux-amd64
      - uses: dtolnay/rust-toolchain@stable
      - name: Build isolated fixture verifier (never uploaded)
        run: cargo build --release -p sbctl --features test-signing --target-dir target-fixtures
      - name: Validate production lifecycle and fixture-signed rollback on systemd hosts
        run: SBCTL_ARTIFACT="$GITHUB_WORKSPACE/sbctl-linux-amd64" SBCTL_TEST_ARTIFACT="$GITHUB_WORKSPACE/target-fixtures/release/sbctl" sh tests/acceptance/run.sh

  package:
    needs: [build-sbctl, build-sbtui, acceptance]
    runs-on: ubuntu-22.04
    environment: release
    env:
      SBCTL_RELEASE_PUBLIC_KEY_HEX: ${{ vars.SBCTL_RELEASE_PUBLIC_KEY_HEX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sbctl-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: sbtui-*
          merge-multiple: true
      - name: Download and verify official sing-box archives
        env:
          SING_BOX_VERSION: ${{ inputs.sing_box_version || '1.12.0' }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            archive="sing-box-${SING_BOX_VERSION}-linux-${arch}.tar.gz"
            url="https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/${archive}"
            curl --fail --location --silent --show-error "$url" --output "$archive"
            mkdir -p "extract-${arch}"
            tar -xzf "$archive" -C "extract-${arch}"
            install -m 0755 "extract-${arch}/sing-box-${SING_BOX_VERSION}-linux-${arch}/sing-box" "sing-box-linux-${arch}"
            rm -rf "extract-${arch}" "$archive"
          done
      - name: Install tooling for manifest signing
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          install -m 0755 sbctl-linux-amd64 /usr/local/bin/sbctl
      - name: Sign and verify every artifact before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          SING_BOX_VERSION: ${{ inputs.sing_box_version || '1.12.0' }}
          SBCTL_SIGNING_SEED: ${{ secrets.SBCTL_SIGNING_SEED }}
        run: |
          set -euo pipefail
          test -n "$SBCTL_SIGNING_SEED" || { echo 'Missing production signing secret' >&2; exit 2; }
          umask 077
          export SBCTL_SIGNING_KEY="$RUNNER_TEMP/sbctl-release-key.hex"
          trap 'rm -f "$SBCTL_SIGNING_KEY"' EXIT
          printf '%s' "$SBCTL_SIGNING_SEED" > "$SBCTL_SIGNING_KEY"
          unset SBCTL_SIGNING_SEED
          python3 scripts/prepare-installer.py install.sh
          for arch in amd64 arm64; do
            scripts/generate-manifest.sh \
              "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$SING_BOX_VERSION" "$arch" \
              "sbctl-linux-$arch" "sing-box-linux-$arch" "manifest-$arch.json"
          done
      - name: Create GitHub release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" \
            sbctl-linux-amd64 sbctl-linux-arm64 sing-box-linux-amd64 sing-box-linux-arm64 \
            sbtui-windows-amd64.exe sbtui-macos-arm64 sbtui-linux-amd64 \
            ly-windows-amd64.exe ly-macos-arm64 ly-linux-amd64 sbtui-install.sh \
            manifest-amd64.json manifest-arm64.json install.sh \
            --repo "$GITHUB_REPOSITORY" --clobber
