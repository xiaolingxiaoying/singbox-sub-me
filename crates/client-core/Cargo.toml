[package]
name = "client-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Shared async control plane for the sbtui/sbgui sing-box clients"

[dependencies]
anyhow = "1.0.99"
base64 = "0.22.1"
chrono = "0.4.42"
dirs = "6.0.0"
flate2 = "1.0"
fs2 = "0.4.3"
futures-util = "0.3.31"
getrandom = "0.3.3"
# The profile override merges with the server's semantics (ADR-0021), so the
# merge lives in one crate both sides depend on rather than being copied.
json-merge = { path = "../json-merge" }
reqwest = { version = "0.12.23", default-features = false, features = ["native-tls", "json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
tar = "0.4"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "sync", "net", "fs"] }
toml = "0.8.20"
zip = { version = "4.3", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
# `prctl(PR_SET_PDEATHSIG)` arms the core so the kernel reaps it if the client
# dies without tearing it down; see `core::attach_orphan_guard`.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Keep this on the same major as sbgui's so the workspace links one copy.
winreg = "0.52.0"
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.23.0"
