[package]
name = "sbtui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Terminal UI sing-box proxy client"

[dependencies]
anyhow = "1.0.99"
base64 = "0.22.1"
clap = { version = "4.5.48", features = ["derive"] }
crossterm = { version = "0.28.1", features = ["event-stream"] }
dirs = "6.0.0"
futures-util = "0.3.31"
ratatui = "0.29.0"
reqwest = { version = "0.12.23", default-features = false, features = ["native-tls", "json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "sync", "net", "fs"] }
toml = "0.8.20"
zip = { version = "4.3", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52.0"
