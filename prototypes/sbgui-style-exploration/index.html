<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Serein GUI · 风格探索</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { min-width: 320px; }
    button { font: inherit; }
    button, [role="button"] { -webkit-tap-highlight-color: transparent; }
    #stage { min-height: 100vh; }

    .proto-picker {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    .proto-picker-highlight {
      position: absolute;
      top: 4px;
      left: 0;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      will-change: transform;
    }

    /* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
    .proto-picker[data-ready] .proto-picker-highlight {
      transition:
        transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
        width 250ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
    }

    .proto-picker-item {
      position: relative; /* sits above the highlight */
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      font: inherit;
      cursor: pointer;
      transition: color 150ms ease-out;
    }

    .proto-picker-item:hover {
      color: rgba(255, 255, 255, 0.85);
    }

    .proto-picker-item:active {
      transform: scale(0.97);
    }

    .proto-picker-item:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.4);
      outline-offset: 2px;
    }

    .proto-picker-item[data-active] {
      color: #fff;
    }

    .proto-picker-divider {
      width: 1px;
      height: 16px;
      margin: 0 4px;
      background: rgba(255, 255, 255, 0.12);
    }

    .proto-picker-replay {
      padding: 0 10px;
      font-size: 14px;
    }

    .proto-picker[data-position="top"] {
      bottom: auto;
      top: 24px;
    }

    /* Shared product primitives */
    .app-surface { min-height: 100vh; overflow: hidden; }
    .brand-mark { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; font-weight: 900; }
    .brand-mark::before { content: "≋"; transform: rotate(-7deg); }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 13%, transparent); }
    .live-dot { opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
    .chart-line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .action-toast { position: fixed; right: 22px; bottom: 74px; z-index: 99; padding: 11px 14px; border-radius: 10px; color: #fff; background: #142321; box-shadow: 0 12px 30px #0003; font: 600 12px/1.3 ui-sans-serif, system-ui; }

    /* Variant 1 — Quiet utility */
    .quiet { --q-accent:#117e79; --q-ink:#17201f; --q-muted:#697573; --q-line:#dce3e1; --q-soft:#edf3f1; background:#f5f7f6; color:var(--q-ink); font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; }
    .quiet .shell { display:grid; grid-template-columns:236px minmax(0,1fr); min-height:100vh; }
    .quiet .side { display:flex; flex-direction:column; padding:18px 14px 88px; border-right:1px solid var(--q-line); background:#fbfcfb; }
    .quiet .brand { display:flex; align-items:center; gap:10px; padding:0 8px 24px; font-size:15px; font-weight:750; }
    .quiet .brand-mark { color:white; background:var(--q-accent); box-shadow:0 2px 0 #0a5e5a; }
    .quiet .nav { display:grid; gap:4px; }
    .quiet .nav button { display:flex; align-items:center; gap:10px; min-height:38px; padding:0 11px; border:0; border-radius:8px; color:#53605e; background:transparent; cursor:pointer; text-align:left; white-space:nowrap; }
    .quiet .nav button:hover { background:#f0f3f2; color:#1b2624; }
    .quiet .nav button.active { color:#0a6561; background:#e8f1ef; font-weight:700; box-shadow:inset 3px 0 var(--q-accent); }
    .quiet .nav .ico { width:20px; text-align:center; font-size:14px; }
    .quiet .nav .badge { margin-left:auto; font:600 10px ui-monospace,monospace; }
    .quiet .rail-status { margin-top:auto; padding:14px; border:1px solid var(--q-line); border-radius:12px; background:white; }
    .quiet .rail-status .eyebrow { margin:0 0 9px; color:var(--q-muted); font-size:10px; letter-spacing:.11em; text-transform:uppercase; }
    .quiet .rail-status strong { display:block; font-size:13px; }
    .quiet .rail-status small { display:block; margin-top:3px; color:var(--q-muted); }
    .quiet .main { padding:26px clamp(24px,4vw,56px) 110px; }
    .quiet .topline { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:26px; }
    .quiet h1 { margin:0; font-size:25px; letter-spacing:-.025em; }
    .quiet .sub { margin:6px 0 0; color:var(--q-muted); font-size:13px; }
    .quiet .actions { display:flex; gap:8px; }
    .quiet .btn { min-height:36px; padding:0 14px; border:1px solid var(--q-line); border-radius:8px; background:#fff; color:var(--q-ink); font-size:12px; font-weight:650; cursor:pointer; }
    .quiet .btn:hover { border-color:#b8c5c2; background:#fbfdfc; }
    .quiet .btn.primary { color:#fff; background:var(--q-ink); border-color:var(--q-ink); }
    .quiet .metric-strip { display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--q-line); border-radius:13px; background:#fff; overflow:hidden; }
    .quiet .metric { padding:18px; border-right:1px solid var(--q-line); }
    .quiet .metric:last-child { border:0; }
    .quiet .metric span { color:var(--q-muted); font-size:11px; }
    .quiet .metric strong { display:block; margin-top:11px; font:650 25px/1 ui-monospace,monospace; letter-spacing:-.06em; }
    .quiet .metric strong em { margin-left:5px; color:var(--q-muted); font:500 10px/1 system-ui; letter-spacing:0; }
    .quiet .content-grid { display:grid; grid-template-columns:minmax(0,1.55fr) minmax(280px,.7fr); gap:14px; margin-top:14px; }
    .quiet .card { border:1px solid var(--q-line); border-radius:13px; background:#fff; }
    .quiet .card-head { display:flex; justify-content:space-between; align-items:flex-start; padding:18px 18px 0; }
    .quiet .card h2 { margin:0; font-size:13px; }
    .quiet .card p.meta { margin:5px 0 0; color:var(--q-muted); font-size:10.5px; }
    .quiet .chart { height:248px; padding:12px 18px 18px; }
    .quiet .chart svg { width:100%; height:190px; }
    .quiet .chart-grid line { stroke:#e8eceb; stroke-width:1; }
    .quiet .node { padding:18px; }
    .quiet .node-top { display:flex; justify-content:space-between; align-items:center; }
    .quiet .node .latency { display:flex; align-items:center; gap:8px; color:#348466; font:650 11px ui-monospace,monospace; }
    .quiet .node-name { margin:26px 0 3px; font-size:24px; letter-spacing:-.04em; }
    .quiet .tag { display:inline-flex; margin-top:8px; padding:4px 7px; border-radius:5px; color:#396a63; background:var(--q-soft); font-size:10px; }
    .quiet .facts { display:grid; gap:0; margin-top:23px; border-top:1px solid var(--q-line); }
    .quiet .fact { display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid #edf0ef; font-size:11px; }
    .quiet .fact span { color:var(--q-muted); }
    .quiet .mode-row { display:flex; gap:4px; margin-top:14px; padding:4px; border-radius:9px; background:#edf1f0; }
    .quiet .mode-row button { flex:1; min-height:30px; border:0; border-radius:6px; color:#65716f; background:transparent; font-size:11px; cursor:pointer; }
    .quiet .mode-row button.active { color:#17201f; background:#fff; box-shadow:0 1px 3px #11201c13; font-weight:700; }

    /* Variant 2 — Command deck */
    .deck { --d-bg:#08110f; --d-panel:#0e1917; --d-panel2:#12201d; --d-line:#20332e; --d-text:#e7f2ee; --d-muted:#789189; --d-lime:#8ee8b4; --d-cyan:#4fd7ca; background:var(--d-bg); color:var(--d-text); font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; }
    .deck .topbar { height:58px; display:flex; align-items:center; gap:22px; padding:0 22px; border-bottom:1px solid var(--d-line); background:#0a1412; }
    .deck .brand { display:flex; align-items:center; gap:10px; font-size:14px; font-weight:800; letter-spacing:.02em; }
    .deck .brand-mark { width:28px;height:28px;color:#07120f;background:var(--d-lime);border-radius:7px; }
    .deck .topnav { display:flex; align-self:stretch; flex:0 0 auto; }
    .deck .topnav button { position:relative; flex:0 0 auto; padding:0 15px; border:0; color:var(--d-muted); background:transparent; font-size:12px; cursor:pointer; white-space:nowrap; }
    .deck .topnav button:hover { color:#cde0d9; }
    .deck .topnav button.active { color:var(--d-text); }
    .deck .topnav button.active::after { content:""; position:absolute; left:15px; right:15px; bottom:0; height:2px; background:var(--d-lime); }
    .deck .core-pill { margin-left:auto; display:flex; align-items:center; gap:9px; padding:7px 10px; border:1px solid #28443b; border-radius:7px; color:var(--d-lime); background:#10221c; font:600 10px ui-monospace,monospace; }
    .deck .layout { display:grid; grid-template-columns:minmax(0,1fr) 298px; min-height:calc(100vh - 58px); }
    .deck .main { padding:24px 24px 104px; }
    .deck .right { padding:20px 18px 94px; border-left:1px solid var(--d-line); background:#0a1412; }
    .deck .head { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:20px; }
    .deck .path { margin:0 0 6px; color:var(--d-cyan); font:600 9px ui-monospace,monospace; letter-spacing:.16em; }
    .deck h1 { margin:0; font-size:25px; font-weight:650; letter-spacing:-.035em; }
    .deck .head .stamp { color:var(--d-muted); font:10px ui-monospace,monospace; }
    .deck .telemetry { display:grid; grid-template-columns:1.35fr .65fr; gap:10px; }
    .deck .panel { border:1px solid var(--d-line); border-radius:9px; background:var(--d-panel); box-shadow:inset 0 1px #ffffff05; }
    .deck .traffic { grid-row:span 2; min-height:360px; padding:19px; }
    .deck .panel-label { display:flex; align-items:center; justify-content:space-between; color:var(--d-muted); font:600 9px ui-monospace,monospace; letter-spacing:.13em; text-transform:uppercase; }
    .deck .panel-label b { color:var(--d-lime); }
    .deck .traffic-numbers { display:flex; gap:34px; margin:24px 0 13px; }
    .deck .traffic-numbers span { color:var(--d-muted); font-size:10px; }
    .deck .traffic-numbers strong { display:block; margin-top:5px; color:var(--d-text); font:500 30px/1 ui-monospace,monospace; letter-spacing:-.07em; }
    .deck .traffic-numbers em { color:var(--d-muted); font:500 9px system-ui; }
    .deck .deck-chart svg { width:100%; height:205px; }
    .deck .deck-chart line { stroke:#1b2d28; }
    .deck .mini { display:flex; flex-direction:column; justify-content:space-between; min-height:174px; padding:17px; }
    .deck .mini strong { font:500 28px/1 ui-monospace,monospace; letter-spacing:-.07em; }
    .deck .mini small { color:var(--d-muted); font:9px ui-monospace,monospace; }
    .deck .route { display:flex; gap:8px; margin-top:10px; }
    .deck .route button { min-width:72px; height:31px; border:1px solid var(--d-line); border-radius:6px; color:var(--d-muted); background:#0b1513; font-size:10px; cursor:pointer; }
    .deck .route button.active { color:#07120f; background:var(--d-lime); border-color:var(--d-lime); font-weight:800; }
    .deck .section-title { margin:4px 0 14px; color:var(--d-muted); font:650 9px ui-monospace,monospace; letter-spacing:.16em; }
    .deck .current-node { padding:17px; border:1px solid #2b4b40; border-radius:9px; background:#10221c; }
    .deck .current-node .row { display:flex; justify-content:space-between; align-items:center; }
    .deck .current-node h2 { margin:19px 0 4px; font-size:21px; }
    .deck .current-node p { margin:0; color:var(--d-muted); font-size:10px; }
    .deck .lat { color:var(--d-lime); font:650 11px ui-monospace,monospace; }
    .deck .test { width:100%; height:34px; margin-top:18px; border:1px solid #386454; border-radius:6px; color:var(--d-lime); background:transparent; font-size:10px; font-weight:700; cursor:pointer; }
    .deck .test:hover { background:#183228; }
    .deck .switch-list { display:grid; gap:8px; margin-top:18px; }
    .deck .switcher { display:flex; align-items:center; justify-content:space-between; padding:12px 13px; border:1px solid var(--d-line); border-radius:8px; background:var(--d-panel); }
    .deck .switcher strong { display:block; font-size:11px; }
    .deck .switcher small { color:var(--d-muted); font-size:9px; }
    .deck .toggle { position:relative; width:35px; height:19px; padding:0; border:0; border-radius:99px; background:#31413c; cursor:pointer; }
    .deck .toggle::after { content:""; position:absolute; top:3px; left:3px; width:13px; height:13px; border-radius:50%; background:#879890; transition:transform 180ms ease-out,background 180ms ease-out; }
    .deck .toggle.on { background:#234d3d; }
    .deck .toggle.on::after { transform:translateX(16px); background:var(--d-lime); }
    .deck .events { margin-top:18px; padding-top:17px; border-top:1px solid var(--d-line); }
    .deck .event { display:grid; grid-template-columns:44px 1fr; gap:8px; padding:8px 0; color:#aabbb5; font-size:9px; line-height:1.4; }
    .deck .event time { color:#4f6d63; font-family:ui-monospace,monospace; }

    /* Variant 3 — Modular workspace */
    .modular { --m-ink:#10231f; --m-muted:#667772; --m-line:#cad8d3; --m-accent:#086f66; --m-mint:#d9f0e8; --m-blue:#dfe9f7; background:#e9efed; color:var(--m-ink); font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; }
    .modular .wrap { max-width:1440px; min-height:100vh; margin:0 auto; padding:18px 20px 104px; }
    .modular .commandbar { display:flex; align-items:center; gap:18px; height:62px; padding:0 12px 0 16px; border:1px solid #b9cac4; border-radius:16px; background:#f8faf9; box-shadow:0 6px 0 #cad7d3; }
    .modular .brand { display:flex; align-items:center; gap:10px; font-weight:800; }
    .modular .brand-mark { color:#fff; background:var(--m-accent); }
    .modular .command-links { display:flex; flex:0 0 auto; gap:4px; }
    .modular .command-links button { flex:0 0 auto; height:34px; padding:0 12px; border:0; border-radius:9px; color:var(--m-muted); background:transparent; font-size:11px; cursor:pointer; white-space:nowrap; }
    .modular .command-links button:hover { background:#eef3f1; }
    .modular .command-links button.active { color:var(--m-ink); background:#e1ebe7; font-weight:750; }
    .modular .quick { margin-left:auto; display:flex; align-items:center; gap:8px; }
    .modular .quick button { height:34px; padding:0 13px; border:1px solid #bdcdc7; border-radius:9px; color:var(--m-ink); background:#fff; font-size:11px; font-weight:650; cursor:pointer; }
    .modular .quick .power { color:#fff; background:var(--m-ink); border-color:var(--m-ink); }
    .modular .workspace { display:grid; grid-template-columns:minmax(0,1.65fr) minmax(330px,.75fr); gap:14px; margin-top:22px; }
    .modular .intro { display:flex; justify-content:space-between; align-items:flex-end; padding:17px 2px 10px; }
    .modular .intro .overline { margin:0 0 6px; color:var(--m-accent); font-size:10px; font-weight:800; letter-spacing:.14em; }
    .modular h1 { margin:0; font-size:30px; line-height:1; letter-spacing:-.045em; }
    .modular .intro p:last-child { margin:0; color:var(--m-muted); font-size:11px; }
    .modular .tile-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; }
    .modular .tile { min-height:130px; padding:17px; border:1px solid #bdcdc7; border-radius:14px; background:#f8faf9; box-shadow:0 3px 0 #cfdbd7; }
    .modular .metric { grid-column:span 2; }
    .modular .tile-label { display:flex; justify-content:space-between; color:var(--m-muted); font-size:10px; }
    .modular .tile-label b { color:var(--m-accent); }
    .modular .metric strong { display:block; margin-top:26px; font:650 27px/1 ui-monospace,monospace; letter-spacing:-.07em; }
    .modular .metric em { color:var(--m-muted); font:500 9px system-ui; }
    .modular .chart-tile { grid-column:span 4; min-height:265px; background:#f8faf9; }
    .modular .chart-tile svg { width:100%; height:196px; margin-top:8px; }
    .modular .node-tile { grid-column:span 2; min-height:265px; background:var(--m-mint); border-color:#a9c9bc; }
    .modular .node-tile h2 { margin:35px 0 4px; font-size:25px; letter-spacing:-.04em; }
    .modular .node-tile p { margin:0; color:#557068; font-size:10px; }
    .modular .node-tile .lat { margin-top:17px; font:700 12px ui-monospace,monospace; }
    .modular .node-tile button { width:100%; height:34px; margin-top:21px; border:1px solid #153f36; border-radius:8px; color:#fff; background:#153f36; font-size:10px; font-weight:700; cursor:pointer; }
    .modular .sidecol { display:flex; flex-direction:column; gap:10px; }
    .modular .side-title { margin:0 2px 2px; color:var(--m-muted); font-size:10px; font-weight:750; letter-spacing:.13em; }
    .modular .mode-card { padding:16px; border:1px solid #b8cbc4; border-radius:14px; background:#f8faf9; box-shadow:0 3px 0 #cfdbd7; }
    .modular .mode-card .seg { display:flex; gap:5px; padding:4px; border-radius:9px; background:#e8efec; }
    .modular .seg button { flex:1; height:32px; border:0; border-radius:7px; color:var(--m-muted); background:transparent; font-size:10px; cursor:pointer; }
    .modular .seg button.active { color:#fff; background:var(--m-accent); font-weight:750; }
    .modular .control { display:flex; align-items:center; gap:12px; padding:15px; border:1px solid #b8cbc4; border-radius:14px; background:#f8faf9; box-shadow:0 3px 0 #cfdbd7; }
    .modular .control .icon { display:grid; place-items:center; width:34px; height:34px; border-radius:9px; color:#245448; background:#e3eee9; font-size:14px; }
    .modular .control strong { display:block; font-size:11px; }
    .modular .control small { color:var(--m-muted); font-size:9.5px; }
    .modular .control .toggle { position:relative; width:38px; height:22px; margin-left:auto; padding:0; border:0; border-radius:99px; background:#bcc9c5; cursor:pointer; }
    .modular .control .toggle::after { content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform 180ms ease-out; box-shadow:0 1px 2px #0002; }
    .modular .control .toggle.on { background:var(--m-accent); }
    .modular .control .toggle.on::after { transform:translateX(16px); }
    .modular .usage { padding:17px; border:1px solid #b7c9d7; border-radius:14px; background:var(--m-blue); box-shadow:0 3px 0 #cad6df; }
    .modular .usage .row { display:flex; justify-content:space-between; font-size:10px; }
    .modular .usage strong { font-size:12px; }
    .modular .meter { height:7px; margin:16px 0 8px; border-radius:99px; background:#b8c9d9; overflow:hidden; }
    .modular .meter i { display:block; width:26%; height:100%; border-radius:inherit; background:#315c7a; }
    .modular .event-card { flex:1; padding:17px; border:1px solid #b8cbc4; border-radius:14px; background:#f8faf9; box-shadow:0 3px 0 #cfdbd7; }
    .modular .event { display:grid; grid-template-columns:44px 8px 1fr; gap:8px; align-items:start; padding:9px 0; border-bottom:1px solid #dbe4e1; color:#465b55; font-size:9.5px; }
    .modular .event time { color:#84928e; font-family:ui-monospace,monospace; }
    .modular .event i { width:6px;height:6px;margin-top:4px;border-radius:50%;background:var(--m-accent); }

    @media (max-width: 920px) {
      .quiet .shell { grid-template-columns:1fr; }
      .quiet .side { position:sticky; top:0; z-index:5; display:block; padding:10px 14px; border-right:0; border-bottom:1px solid var(--q-line); }
      .quiet .brand { display:none; }
      .quiet .nav { display:flex; overflow:auto; }
      .quiet .nav button { flex:0 0 auto; }
      .quiet .rail-status { display:none; }
      .quiet .main { padding:22px 16px 110px; }
      .quiet .metric-strip { grid-template-columns:repeat(2,1fr); }
      .quiet .metric:nth-child(2) { border-right:0; }
      .quiet .metric:nth-child(-n+2) { border-bottom:1px solid var(--q-line); }
      .quiet .content-grid { grid-template-columns:1fr; }

      .deck .topbar { overflow:auto; }
      .deck .brand { position:sticky; left:0; z-index:2; padding-right:8px; background:#0a1412; }
      .deck .layout { grid-template-columns:1fr; }
      .deck .right { border-left:0; border-top:1px solid var(--d-line); }
      .deck .core-pill { display:none; }

      .modular .commandbar { overflow:auto; }
      .modular .brand { position:sticky; left:0; z-index:2; padding-right:10px; background:#f8faf9; }
      .modular .quick { display:none; }
      .modular .workspace { grid-template-columns:1fr; }
      .modular .wrap { padding-inline:12px; }
    }
    @media (max-width: 620px) {
      .proto-picker { max-width:calc(100vw - 20px); overflow:auto; bottom:12px; }
      .proto-picker-item { padding:0 10px; white-space:nowrap; }
      .quiet .topline, .deck .head, .modular .intro { align-items:flex-start; flex-direction:column; gap:12px; }
      .quiet .metric-strip { grid-template-columns:1fr; }
      .quiet .metric { border-right:0; border-bottom:1px solid var(--q-line); }
      .quiet .actions { width:100%; }
      .quiet .actions .btn { flex:1; }
      .deck .main { padding:20px 14px 94px; }
      .deck .telemetry { grid-template-columns:1fr; }
      .deck .traffic { grid-row:auto; }
      .deck .right { padding:18px 14px 94px; }
      .deck .topnav button { padding-inline:10px; }
      .modular .tile-grid { grid-template-columns:1fr; }
      .modular .metric,.modular .chart-tile,.modular .node-tile { grid-column:auto; }
      .modular .command-links button { padding-inline:9px; }
    }
  </style>
</head>
<body>
  <main id="stage"></main>

  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">静谧工具</button>
    <button class="proto-picker-item">深空控制台</button>
    <button class="proto-picker-item">晶格工作台</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>

  <script>
    const chartA = `<svg viewBox="0 0 640 190" preserveAspectRatio="none" aria-label="最近五分钟流量曲线">
      <g class="chart-grid"><line x1="0" y1="35" x2="640" y2="35"/><line x1="0" y1="90" x2="640" y2="90"/><line x1="0" y1="145" x2="640" y2="145"/></g>
      <path d="M0 150 C55 148 65 116 112 123 S184 135 215 92 S278 74 310 102 S365 137 402 84 S458 66 490 98 S552 122 640 52" fill="none" stroke="#117e79" stroke-width="2.4" class="chart-line"/>
      <path d="M0 166 C88 158 113 165 156 148 S229 155 265 137 S331 154 374 141 S453 146 492 130 S563 149 640 119" fill="none" stroke="#9bada8" stroke-width="1.6" opacity=".7"/>
    </svg>`;

    const chartB = `<svg viewBox="0 0 640 205" preserveAspectRatio="none" aria-label="实时上下行流量曲线">
      <g><line x1="0" y1="40" x2="640" y2="40"/><line x1="0" y1="100" x2="640" y2="100"/><line x1="0" y1="160" x2="640" y2="160"/></g>
      <path d="M0 170 C46 170 61 146 101 150 S160 128 199 139 S251 84 292 105 S358 156 405 115 S462 69 503 98 S566 124 640 55" fill="none" stroke="#8ee8b4" stroke-width="2.4" class="chart-line"/>
      <path d="M0 186 C73 176 103 182 143 166 S227 178 269 150 S354 172 401 152 S498 168 541 141 S591 150 640 132" fill="none" stroke="#4fd7ca" stroke-width="1.5" opacity=".65"/>
    </svg>`;

    const navItems = ["▦ 概览","↓ 订阅","▤ 节点","⌁ 规则","⌘ 连接","›_ 日志","☷ 设置"];

    function quietVariant() {
      return `<section class="app-surface quiet">
        <div class="shell">
          <aside class="side">
            <div class="brand"><span class="brand-mark"></span><span>Serein</span></div>
            <nav class="nav" aria-label="主导航">${navItems.map((n,i)=>`<button class="${i===0?'active':''}"><span class="ico">${n.split(' ')[0]}</span><span>${n.slice(n.indexOf(' ')+1)}</span>${i===1?'<span class="badge">3</span>':i===4?'<span class="badge">10</span>':''}</button>`).join('')}</nav>
            <div class="rail-status"><p class="eyebrow">当前订阅</p><strong>家庭节点</strong><small>128.4 / 500 GB · 09:42</small></div>
          </aside>
          <main class="main">
            <header class="topline"><div><h1>概览</h1><p class="sub">内核状态、当前节点、实时流量与活跃连接。</p></div><div class="actions"><button class="btn" data-action="restart">重启内核</button><button class="btn primary" data-action="power">停止内核</button></div></header>
            <section class="metric-strip">
              <div class="metric"><span>实时下载</span><strong>8.42<em>MB/s</em></strong></div><div class="metric"><span>实时上传</span><strong>1.18<em>MB/s</em></strong></div><div class="metric"><span>活跃连接</span><strong>10<em>条</em></strong></div><div class="metric"><span>累计流量</span><strong>21.1<em>GB</em></strong></div>
            </section>
            <div class="content-grid">
              <section class="card"><div class="card-head"><div><h2>本机 sing-box 流量</h2><p class="meta">最近 5 分钟 · 每 1 秒采样</p></div><p class="meta">下载 8.42　上传 1.18 MB/s</p></div><div class="chart">${chartA}</div></section>
              <section class="card node"><div class="node-top"><h2>当前节点</h2><span class="latency"><i class="status-dot live-dot"></i><b data-latency>42 ms</b></span></div><h3 class="node-name">香港 03</h3><p class="meta">节点选择 · 手动选择组</p><span class="tag">Hysteria 2</span><div class="facts"><div class="fact"><span>内核版本</span><b>v1.10.1</b></div><div class="fact"><span>运行时间</span><b>02:48:16</b></div><div class="fact"><span>自动重启</span><b>1 次</b></div></div><div class="mode-row" data-mode><button class="active">规则</button><button>全局</button><button>直连</button></div></section>
            </div>
          </main>
        </div>
      </section>`;
    }

    function deckVariant() {
      return `<section class="app-surface deck">
        <header class="topbar"><div class="brand"><span class="brand-mark"></span>SEREIN</div><nav class="topnav" aria-label="主导航">${["概览","订阅","节点","规则","连接","日志","设置"].map((n,i)=>`<button class="${i===0?'active':''}">${n}${i===4?' · 10':''}</button>`).join('')}</nav><div class="core-pill"><i class="status-dot live-dot"></i> CORE ONLINE</div></header>
        <div class="layout">
          <main class="main"><header class="head"><div><p class="path">LOCAL / SING-BOX / OVERVIEW</p><h1>运行控制台</h1></div><span class="stamp">SYNC 09:42:18 · API 127.0.0.1:9090</span></header>
            <div class="telemetry">
              <section class="panel traffic"><div class="panel-label"><span>实时遥测 / 5 MIN</span><b>● LIVE</b></div><div class="traffic-numbers"><div><span>DOWNLOAD</span><strong>8.42 <em>MB/S</em></strong></div><div><span>UPLOAD</span><strong>1.18 <em>MB/S</em></strong></div></div><div class="deck-chart">${chartB}</div><div class="route" data-mode><button class="active">RULE</button><button>GLOBAL</button><button>DIRECT</button></div></section>
              <section class="panel mini"><div class="panel-label"><span>ACTIVE FLOWS</span><b>+2</b></div><strong>010</strong><small>TCP 008 / UDP 002</small></section>
              <section class="panel mini"><div class="panel-label"><span>TOTAL TRANSFER</span><b>24H</b></div><strong>21.1 <small>GB</small></strong><small>↓18.4 / ↑2.7</small></section>
            </div>
          </main>
          <aside class="right"><p class="section-title">ACTIVE ROUTE</p><section class="current-node"><div class="row"><span class="panel-label">MANUAL SELECT</span><span class="lat" data-latency>42 MS</span></div><h2>香港 03</h2><p>HYSTERIA 2 · NODE SELECT</p><button class="test" data-action="latency">RUN LATENCY TEST</button></section>
            <div class="switch-list"><div class="switcher"><div><strong>系统代理</strong><small>127.0.0.1:2080</small></div><button class="toggle on" aria-label="系统代理" data-toggle></button></div><div class="switcher"><div><strong>TUN 模式</strong><small>需要管理员权限</small></div><button class="toggle" aria-label="TUN 模式" data-toggle></button></div><div class="switcher"><div><strong>sing-box 内核</strong><small>v1.10.1 · 02:48:16</small></div><button class="toggle on" aria-label="sing-box 内核" data-toggle></button></div></div>
            <div class="events"><p class="section-title">CLIENT EVENTS</p><div class="event"><time>09:42</time><span>配置检查通过，内核已启动</span></div><div class="event"><time>09:40</time><span>系统代理已连接至本地端口 2080</span></div><div class="event"><time>09:35</time><span>延迟测试完成，可用 9 / 超时 1</span></div></div>
          </aside>
        </div>
      </section>`;
    }

    function modularVariant() {
      return `<section class="app-surface modular"><div class="wrap">
        <header class="commandbar"><div class="brand"><span class="brand-mark"></span>Serein</div><nav class="command-links" aria-label="主导航">${["概览","订阅","节点","规则","连接","日志"].map((n,i)=>`<button class="${i===0?'active':''}">${n}</button>`).join('')}</nav><div class="quick"><button data-action="restart">↻ 重启</button><button class="power" data-action="power">停止内核</button></div></header>
        <div class="workspace">
          <main><header class="intro"><div><p class="overline">工作台 / OVERVIEW</p><h1>网络一切正常。</h1></div><p>上次同步 09:42 · 运行 02:48:16</p></header>
            <div class="tile-grid"><section class="tile metric"><div class="tile-label"><span>下载速率</span><b>LIVE</b></div><strong>8.42 <em>MB/s</em></strong></section><section class="tile metric"><div class="tile-label"><span>上传速率</span><b>LIVE</b></div><strong>1.18 <em>MB/s</em></strong></section><section class="tile metric"><div class="tile-label"><span>活跃连接</span><b>+2</b></div><strong>10 <em>条</em></strong></section>
              <section class="tile chart-tile"><div class="tile-label"><span>本机 sing-box 流量 · 最近 5 分钟</span><span>总计 21.1 GB</span></div>${chartA}</section>
              <section class="tile node-tile"><div class="tile-label"><span>当前节点</span><b data-latency>42 ms</b></div><h2>香港 03</h2><p>节点选择 · Hysteria 2</p><div class="lat">● 连接稳定</div><button data-action="latency">重新测试延迟</button></section>
            </div>
          </main>
          <aside class="sidecol"><p class="side-title">QUICK CONTROL</p><section class="mode-card"><div class="seg" data-mode><button class="active">规则</button><button>全局</button><button>直连</button></div></section>
            <section class="control"><span class="icon">⌁</span><div><strong>系统代理</strong><small>已启用 · 127.0.0.1:2080</small></div><button class="toggle on" aria-label="系统代理" data-toggle></button></section>
            <section class="control"><span class="icon">◎</span><div><strong>TUN 模式</strong><small>完整接管系统流量</small></div><button class="toggle" aria-label="TUN 模式" data-toggle></button></section>
            <section class="control"><span class="icon">▣</span><div><strong>sing-box 内核</strong><small>v1.10.1 · 运行中</small></div><button class="toggle on" aria-label="sing-box 内核" data-toggle></button></section>
            <section class="usage"><div class="row"><strong>家庭节点</strong><span>09:42</span></div><div class="meter"><i></i></div><div class="row"><span>128.4 / 500 GB</span><span>到期 2026-10-21</span></div></section>
            <section class="event-card"><p class="side-title">最近事件</p><div class="event"><time>09:42</time><i></i><span>内核已启动，配置检查通过</span></div><div class="event"><time>09:40</time><i></i><span>系统代理已启用</span></div><div class="event"><time>09:35</time><i></i><span>节点延迟测试完成</span></div></section>
          </aside>
        </div>
      </div></section>`;
    }

    // `variants` is an array of render functions, one per variant, in picker order.
    const variants = [quietVariant, deckVariant, modularVariant];
    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    let current = 0;

    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function mount(i) {
      stage.innerHTML = '';
      // Clear first, render next frame, so entrance animations re-run.
      requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
    }

    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', i + 1);
      history.replaceState(null, '', url);
      mount(i);
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);

    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
    });

    stage.addEventListener('click', (e) => {
      const toggle = e.target.closest('[data-toggle]');
      if (toggle) { toggle.classList.toggle('on'); toast(`${toggle.getAttribute('aria-label')}已${toggle.classList.contains('on')?'启用':'关闭'}`); return; }
      const mode = e.target.closest('[data-mode] button');
      if (mode) { [...mode.parentElement.children].forEach(b=>b.classList.remove('active')); mode.classList.add('active'); toast(`已切换到${mode.textContent.trim()}模式`); return; }
      const action = e.target.closest('[data-action]');
      if (!action) return;
      if (action.dataset.action === 'latency') {
        action.disabled = true; action.textContent = '测试中…';
        setTimeout(()=>{ document.querySelectorAll('[data-latency]').forEach(el=>el.textContent='38 ms'); action.disabled=false; action.textContent=current===1?'RUN LATENCY TEST':'重新测试延迟'; toast('延迟测试完成：38 ms'); }, 700);
      } else if (action.dataset.action === 'restart') toast('内核正在重启，配置检查已通过');
      else { action.textContent = action.textContent.includes('停止') ? '启动内核' : '停止内核'; toast('内核运行状态已切换'); }
    });

    function toast(message) {
      document.querySelector('.action-toast')?.remove();
      const el = document.createElement('div'); el.className='action-toast'; el.textContent=message; document.body.appendChild(el);
      setTimeout(()=>el.remove(), 1700);
    }

    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    // Enable the slide only after first paint, so load doesn't animate.
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
</body>
</html>
